name: Installer safety checks

permissions:
  contents: read

on:
  push:
    paths:
      - install/**
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - install/**
      - .github/workflows/installer.yml

jobs:
  static-and-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: install
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Shell syntax and ShellCheck
        run: |
          bash -n install.sh
          shellcheck install.sh
      - name: Python syntax and offline tests
        run: |
          python3 -m compileall -q installer tests/installer
          python3 -m unittest discover -s tests/installer -v
      - name: Manifest and read-only dry run
        run: |
          python3 -m installer.main --list --json > /tmp/installer-list.json
          python3 -m installer.main --dry-run --profile minimal --json > /tmp/installer-plan.json
          python3 - <<'PY'
          import json
          assert len(json.load(open('/tmp/installer-list.json'))) == 109
          assert json.load(open('/tmp/installer-plan.json'))['selected_count'] == 6
          PY
      - name: Limited secret and personal path scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path('install.sh'), *Path('installer').glob('*.py'), *(p for p in Path('manifests').rglob('*') if p.is_file()), *Path('patches').rglob('*.patch')]
          pattern = re.compile(r'/Users/[A-Za-z0-9._-]+/|-----BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20}')
          for path in files:
              assert not pattern.search(path.read_text()), f'possible sensitive content: {path}'
          PY
