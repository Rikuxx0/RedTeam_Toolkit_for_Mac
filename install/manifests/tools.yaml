schema_version: 1
audit_date: '2026-11-10'
platform: darwin-arm64
profiles:
  minimal:
    tools: [python, go, cmake, nmap, ffuf, nuclei, wordlists]
  standard:
    include_non_optional: true
    tools: [bloodhound-ce-python, pmapper, roadtx, roadrecon, azure-cli, gcloud-cli, kubectl, subfinder, amass, feroxbuster, gobuster, sqlmap, wpscan, dnsrecon, dirsearch]
  full:
    include_all: true
aliases:
  sliver: [sliver-server, sliver-client]
patch_records:
  havoc:
    kind: source-snapshots
    record: patches/havoc/source-fingerprints.yaml
    readme: patches/havoc/README.md
    upstream_revision: unknown
    automatic_application: false
  netexec:
    kind: unified-diff
    file: patches/netexec/version-exit-code.patch
    readme: patches/netexec/README.md
    upstream_revision: c7dc286ba65daf10402cdc470e531b84e6d3d911
    upstream_file_sha256: 596c98a6aa6266f0d516912f3b1afa631a7b526284cc6218897a395e5b61c1e2
python_environment_locks:
  .venv: manifests/python/project-shared.lock.json
  cloud/Graphpython/.venv: manifests/python/cloud-graphpython.lock.json
  cloud/GCP-Hound/.venv: manifests/python/cloud-gcp-hound.lock.json
  uv-tool:bloodhound-ce: manifests/python/uv-bloodhound-ce.lock.json
  uv-tool:netexec: manifests/python/uv-netexec.lock.json
  uv-tool:principalmapper: manifests/python/uv-principalmapper.lock.json
  uv-tool:roadrecon: manifests/python/uv-roadrecon.lock.json
  uv-tool:roadtx: manifests/python/uv-roadtx.lock.json
# installed = 実体確認、verified = 安全な動作確認成功、missing = 実体なし、
# broken = 実体はあるが動作しない、unknown = 判定できない。
# executable はリポジトリ相対パスか PATH 上のコマンド名。~ や個人名を含めない。
# version はこのホストで観測した値であり、将来の推奨最新版ではない。
tools:
  - {id: sliver-server, name: Sliver Server, category: c2, install_method: official-binary, source: 'https://github.com/BishopFox/sliver', version: '1.7.9 (previously reported)', revision: '6cf3ad78bdc6eed799186194e6f4e6fd662dcd8c (previously reported)', architecture: darwin-arm64, executable: c2/Sliver/bin/sliver-server_darwin-arm64, install_scope: repo, dependencies: [], optional: false, status: installed, verification: {command: 'file c2/Sliver/bin/sliver-server_darwin-arm64', expected_exit_code: 0}, notes: ['Version/revision not rechecked by execution in this audit; checksum in versions.lock']}
